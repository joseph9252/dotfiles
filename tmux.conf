##### 기본 #####
set -g mouse on                 # 마우스로 pane 선택/리사이즈
set -g history-limit 10000      # 스크롤 히스토리 충분히
set -s escape-time 0            # 키 반응 빠르게

##### prefix 변경 (Ctrl+b → Ctrl+a) #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix            # tmux 안에 tmux 있을 때 C-a a 로 prefix 전달

##### pane 이동 / 분할 / 사이즈 #####
# 분할
bind-key -n C-- split-window -v          # Ctrl+-: 가로 분할 (위/아래)
bind-key -n 'C-\' split-window -h        # Ctrl+|: 세로 분할 (좌/우)

# 이동 (hjkl + 방향키 둘 다 지원)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R

# 리사이즈 (Shift+HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 현재 pane만 전체 화면 토글
bind z resize-pane -Z

# pane 포커스 순환
bind-key -n C-] select-pane -t :.+    # Ctrl+]: 다음 pane
bind-key -n C-[ select-pane -t :.-    # Ctrl+[: 이전 pane

# window 순환
bind-key -n C-S-] next-window         # Ctrl+Shift+]: 다음 window
bind-key -n C-S-[ previous-window     # Ctrl+Shift+[: 이전 window
bind ] next-window                    # Ctrl+a then ]: 다음 window
bind [ previous-window                # Ctrl+a then [: 이전 window

# window 번호로 직접 이동
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# pane/window 종료
bind q kill-pane
bind Q kill-window

##### window / session #####
set -g base-index 1             # window 번호 1부터
setw -g pane-base-index 1       # pane 번호도 1부터
set -g status-left '#[fg=green][#S]#[default]'

bind c new-window               # 새 window
bind , command-prompt "rename-window %%"
bind w choose-window            # window 리스트 선택
bind s choose-session           # session 리스트 선택

##### 상태바 (맥북/맥미니 모두 공용) #####
set -g status-position top        # 상태바를 위쪽으로
set -g status-interval 1
set -g status-justify centre

set -g status-bg black
set -g status-fg white

set -g status-left-length 30
set -g status-right-length 80

# 왼쪽: tmux + 세션명
set -g status-left '#[fg=cyan]tmux:#S #[default]'

# 오른쪽: 비우기
set -g status-right ''

# window 번호만 표시 (이름 제외)
setw -g window-status-format ' #I '
setw -g window-status-current-format ' #[bold]#I#[nobold] '

# pane 테두리 색
set -g pane-border-style        'fg=colour239'
set -g pane-active-border-style 'fg=colour10'

# 비활성 pane을 어둡게 (활성 pane 강조)
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour250,bg=black'

# 메시지 박스 색
set -g message-style 'bg=colour237,fg=colour10'

##### true color / 터미널 설정 #####
# 최신 tmux + iTerm 조합용
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# 윈도우별 리사이즈 좀 더 자연스럽게
setw -g aggressive-resize on

##### reload 단축키 #####
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

### 세션/윈도우 추가 ###
bind-key -n C-t new-window                           # Ctrl+t: 새 window
bind-key -n C-S-n command-prompt "new-session -s '%%'"  # Ctrl+Shift+n: 새 session
